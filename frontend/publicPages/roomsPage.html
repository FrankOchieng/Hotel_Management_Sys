<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Rooms - LuxeStay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">LuxeStay</h1>
            <nav class="hidden md:flex space-x-8 nav-links">
                <a href="homepage.html" class="text-gray-500 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Home</a>
                <a href="roomsPage.html" class="text-blue-600 px-3 py-2 rounded-md text-sm font-medium active">Rooms</a>
                <a href="servicePage.html" class="text-blue-600 px-3 py-2 rounded-md text-sm font-medium active">Services</a>
                <a href="bookings.html" class="text-gray-500 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Bookings</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="text-center mb-16">
            <h2 class="text-base text-blue-600 font-semibold tracking-wide uppercase">Accommodations</h2>
            <p class="mt-2 text-3xl leading-8 font-extrabold tracking-tight text-gray-900 sm:text-4xl">
                Find Your Perfect Stay
            </p>
        </div>

        <div id="roomShowcaseContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full text-center py-10">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500"></i>
                <p class="mt-4 text-gray-500">Loading available rooms...</p>
            </div>
        </div>
    </main>

    <script src="roomsPage.js"></script>
    <script src="globalAuth.js"></script>
</body>
</html>
